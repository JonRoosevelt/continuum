name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: ""
          - os: ubuntu-latest
            flags: "--no-default-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --workspace ${{ matrix.flags }} -- -D warnings
      - name: test
        run: cargo test --workspace ${{ matrix.flags }}
      - name: headless build (no GTK)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p continuum-app --no-default-features
