name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: ""
          - os: ubuntu-latest
            flags: "--no-default-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p continuum-app ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-${{ matrix.os }}
          path: target/release/continuum
