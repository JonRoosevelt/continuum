name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: bundle app
        run: bash scripts/bundle-macos.sh
      - name: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist && zip -q -r "../Continuum-${VERSION}.zip" Continuum.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Continuum-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: build
        run: cargo build --release -p continuum-app
      - name: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          cp target/release/continuum pkg/
          tar -C pkg -czf "continuum-${VERSION}-x86_64-linux.tar.gz" continuum
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: continuum-*.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes -R "$GITHUB_REPOSITORY" \
            ./*.zip ./*.tar.gz SHA256SUMS
