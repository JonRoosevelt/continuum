[package]
name = "continuum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Continuum tray application"

[[bin]]
name = "continuum"
path = "src/main.rs"

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:muda", "dep:tao"]

[dependencies]
continuum-core.workspace = true
continuum-platform.workspace = true
continuum-net.workspace = true
tray-icon = { version = "0.24.2", optional = true }
muda = { version = "0.19.3", optional = true }
tao = { version = "0.36.0", optional = true }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"
dirs = "7.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSPanel",
    "NSProgressIndicator",
    "NSResponder",
    "NSScreen",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSGeometry",
    "NSString",
    "objc2-core-foundation",
] }

[lints]
workspace = true
