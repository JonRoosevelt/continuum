[package]
name = "continuum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Continuum tray application"

[[bin]]
name = "continuum"
path = "src/main.rs"

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:muda", "dep:tao"]

[dependencies]
continuum-core.workspace = true
continuum-platform.workspace = true
continuum-net.workspace = true
tray-icon = { version = "0.24.2", optional = true }
muda = { version = "0.19.3", optional = true }
tao = { version = "0.36.0", optional = true }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"
dirs = "7.0.0"

[lints]
workspace = true
