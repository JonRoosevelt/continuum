[package]
name = "continuum-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform clipboard capture and injection for Continuum"

[dependencies]
continuum-core.workspace = true
thiserror = "2.0.21"

[lints]
workspace = true

[target.'cfg(target_os="macos")'.dependencies]
image = { version = "0.25.6", default-features = false, features = ["png", "tiff"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSArray", "NSString"] }

[target.'cfg(target_os="linux")'.dependencies]
wl-clipboard-rs = "0.9.3"
x11rb = "0.14.0"
